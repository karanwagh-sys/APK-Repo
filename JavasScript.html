    UI_TEXT_ORIGINALS.set(node, original);
    const leading = (original.match(/^\s*/) || [""])[0];
    const trailing = (original.match(/\s*$/) || [""])[0];
    const value = original.trim();
    if (!value) return;
    node.nodeValue = leading + translateUiText(value) + trailing;
}

function localiseAttributes(element) {
    if (!element || element.closest?.(".status-badge, [data-record-value], [data-i18n-ignore]")) return;
    ["placeholder", "aria-label"].forEach(attribute => {
        if (!element.hasAttribute(attribute)) return;
        let originals = UI_ATTRIBUTE_ORIGINALS.get(element);
        if (!originals) {
            originals = {};
            UI_ATTRIBUTE_ORIGINALS.set(element, originals);
        }
        if (!Object.prototype.hasOwnProperty.call(originals, attribute)) originals[attribute] = element.getAttribute(attribute);
        element.setAttribute(attribute, translateUiText(originals[attribute]));
    });
}

function localiseTree(root) {
    if (!root) return;
    if (root.nodeType === Node.TEXT_NODE) {
        localiseTextNode(root);
        return;
    }
    if (root.nodeType !== Node.ELEMENT_NODE && root.nodeType !== Node.DOCUMENT_NODE) return;
    if (root.nodeType === Node.ELEMENT_NODE) localiseAttributes(root);
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(localiseTextNode);
    root.querySelectorAll?.("[placeholder], [aria-label]").forEach(localiseAttributes);
}

function observeUiLanguageChanges() {
    if (uiLanguageObserver || !document.body) return;
    uiLanguageObserver = new MutationObserver(mutations => {
        mutations.forEach(mutation => mutation.addedNodes.forEach(localiseTree));
    });
    uiLanguageObserver.observe(document.body, { childList: true, subtree: true });
}

function setUiLanguage(language, persist) {
    const code = Object.prototype.hasOwnProperty.call(UI_DICTIONARIES, language) ? language : "en";
    APP.uiLanguage = code;
    const meta = UI_LANGUAGE_META[code] || UI_LANGUAGE_META.en;
    document.documentElement.lang = meta.locale;
    /* Keep the app shell stable on every screen size.  Urdu text itself is
       right-aligned, but the navigation/sidebar layout remains unchanged. */
    document.documentElement.dir = "ltr";
    document.body?.classList.toggle("ui-rtl", meta.direction === "rtl");
    localiseTree(document.body);
    observeUiLanguageChanges();
    const select = $("ddlUiLanguage");
    if (select) select.value = code;
    if (persist) localStorage.setItem(uiLanguageStorageKey(), code);
}

function initialiseLanguageSettings() {
    const enabled = !!APP.configuration?.translationEnabled;
    const card = $("languageSettingsCard");
    if (card) card.classList.toggle("hidden", !enabled);
    setUiLanguage(enabled ? (localStorage.getItem(uiLanguageStorageKey()) || "en") : "en", false);
}

function loadUserUiLanguagePreference() {
    if (!APP.configuration?.translationEnabled) return;
    setUiLanguage(localStorage.getItem(uiLanguageStorageKey()) || "en", false);
}

function applyAppBranding() {

    const config = window.APP_BOOT_CONFIG || {};
    APP.configuration = config;

    document.querySelectorAll("[data-app-name]").forEach(element => {
        element.textContent = config.name || "";
    });
    document.querySelectorAll("[data-app-company]").forEach(element => {
        element.textContent = config.company || "";
    });
    document.querySelectorAll("[data-app-version]").forEach(element => {
        element.textContent = config.version ? "Version " + config.version : "";
    });
    document.querySelectorAll("[data-app-logo]").forEach(image => {
        if (config.logoUrl) image.src = config.logoUrl;
    });

    if (config.name) document.title = config.name;
    if (config.themeColor) {
        document.querySelector('meta[name="theme-color"]')?.setAttribute("content", config.themeColor);
    }

    initialiseAppearanceSettings();
    initialiseLanguageSettings();
}

/* Appearance preferences are browser-only. They never alter application
   records or the language/content stored in Google Sheets. */
function setDarkMode(enabled) {
    const enabledByConfiguration = !!APP.configuration?.darkModeEnabled;
    const active = enabledByConfiguration && !!enabled;

    document.body.classList.toggle("dark-mode", active);

    if (enabledByConfiguration)
        localStorage.setItem("ownFleetDarkMode", active ? "yes" : "no");

    const toggle = $("toggleDarkMode");
    if (toggle) toggle.checked = active;
}

function initialiseAppearanceSettings() {
    const enabled = !!APP.configuration?.darkModeEnabled;
    const card = $("appearanceSettingsCard");

    if (card) card.classList.toggle("hidden", !enabled);
    if (!enabled) {
        document.body.classList.remove("dark-mode");
        return;
    }

    setDarkMode(localStorage.getItem("ownFleetDarkMode") === "yes");
}

function isCsrUser() {
    return String(APP.user?.access || "").trim().toUpperCase() === "CSR";
}

function isCsrAdmin() {
    return isCsrUser() && ["ADMIN", "SUPER_ADMIN"].includes(normaliseRole(APP.user?.role));
}

function isCsrCallingAgent() {
    return isCsrUser() && normaliseRole(APP.user?.role) === "CALLING_AGENT";
}

function csrMyName() {
    return String(APP.user?.name || APP.user?.riderName || APP.user?.username || "").trim();
}

function setCsrSelectOptions(id, values, allLabel) {
    const select = $(id);
    if (!select) return;
    const selected = select.value;
    const unique = [...new Set((values || []).map(value => String(value || "").trim()).filter(Boolean))]
        .sort((a, b) => a.localeCompare(b));
    select.innerHTML = `<option value="">${escapeHtml(allLabel)}</option>` +
        unique.map(value => `<option value="${escapeHtml(value)}">${escapeHtml(value)}</option>`).join("");
    if (unique.includes(selected)) select.value = selected;
}

function initializeCsrEvents() {
    $("btnRefreshCsrDashboard")?.addEventListener("click", loadCsrDashboard);
    $("btnRefreshCsrQueue")?.addEventListener("click", loadCsrQueue);
    $("btnSyncCsrTickets")?.addEventListener("click", syncCsrTickets);
    $("btnRefreshCsrRepository")?.addEventListener("click", loadCsrRepository);
    $("btnBackToCsrQueue")?.addEventListener("click", () => navigate("csrPending"));
    $("btnClaimCsrAdminReview")?.addEventListener("click", claimCsrAdminReview);
    $("btnAssignCsrTickets")?.addEventListener("click", assignSelectedCsrTickets);
    $("chkCsrSelectAll")?.addEventListener("change", event => {
        document.querySelectorAll(".csr-ticket-check").forEach(box => { box.checked = event.target.checked; });
    });

    ["txtCsrSearch", "ddlCsrZone", "ddlCsrWarehouse", "ddlCsrHub", "ddlCsrFinalStatus", "dtCsrCreatedFrom", "dtCsrCreatedTo"]
        .forEach(id => $(id)?.addEventListener(id === "txtCsrSearch" ? "input" : "change", debounce(loadCsrQueue, 250)));
    ["txtCsrRepositorySearch", "ddlCsrRepositoryStatus", "dtCsrRepositoryCreatedFrom", "dtCsrRepositoryCreatedTo"]
        .forEach(id => $(id)?.addEventListener(id === "txtCsrRepositorySearch" ? "input" : "change", debounce(loadCsrRepository, 250)));
}

async function syncCsrTickets() {

    if (!isCsrAdmin()) return;

    const confirmed = await confirmAction({
        title: "Sync NDR tickets?",
        message: "This will find approved submissions marked Push For NDR Calling and create only missing CSR tickets. Existing tickets will not be changed.",
        confirmText: "Sync Tickets"
    });

    if (!confirmed) return;

    try {
        showLoader(
            "Syncing CSR tickets",
            "Checking approved NDR submissions and safely creating only missing tickets."
        );

        const response = await server("syncCsrTickets");

        if (!response.success)
            throw new Error(response.message || "Could not sync CSR tickets.");

        showToast(response.message, "success");
        await loadCsrQueue();
    } catch (error) {
        showToast(error.message || "Could not sync CSR tickets.", "error");
    } finally {
        hideLoader();
    }

}

function debounce(fn, wait) {
    let timer;
    return function () {
        clearTimeout(timer);
        timer = setTimeout(fn, wait);
    };
}

async function ensureCsrReferenceData() {
    if (!isCsrUser()) return;

    const [locationsResult, agentsResult, reasonsResult, outcomesResult] = await Promise.all([
        server("csrLocationOptions"),
        isCsrAdmin() ? server("csrCallingAgents") : Promise.resolve({ success: true, data: [] }),
        isCsrCallingAgent() ? server("csrReasons") : Promise.resolve({ success: true, data: [] }),
        isCsrCallingAgent() ? server("csrClosingOutcomes") : Promise.resolve({ success: true, data: [] })
    ]);

    if (locationsResult.success) {
        APP.csr.locations = locationsResult.data || [];
        setCsrSelectOptions("ddlCsrZone", APP.csr.locations.map(row => row.zone), "All Zones");
        setCsrSelectOptions("ddlCsrWarehouse", APP.csr.locations.map(row => row.warehouse), "All Warehouses");
        setCsrSelectOptions("ddlCsrHub", APP.csr.locations.map(row => row.lmHub), "All LM Hubs");
    }
    if (agentsResult.success) {
        APP.csr.agents = agentsResult.data || [];
        const select = $("ddlCsrCallingAgent");
        if (select) {
            select.innerHTML = '<option value="">Select Calling Agent</option>' + APP.csr.agents.map(agent =>
                `<option value="${escapeHtml(agent.username)}">${escapeHtml(agent.name)} — ${escapeHtml(agent.zone || "All locations")}</option>`
            ).join("");
        }
    }
    if (reasonsResult.success) APP.csr.reasons = reasonsResult.data || [];
    if (outcomesResult.success) APP.csr.closingOutcomes = outcomesResult.data || [];
}

function csrFilters(prefix) {
    if (prefix === "repository") {
        return {
            search: $("txtCsrRepositorySearch")?.value.trim() || "",
            status: $("ddlCsrRepositoryStatus")?.value || "",
            startDate: $("dtCsrRepositoryCreatedFrom")?.value || "",
            endDate: $("dtCsrRepositoryCreatedTo")?.value || ""
        };
    }
    return {
        search: $("txtCsrSearch")?.value.trim() || "",
        zone: $("ddlCsrZone")?.value || "",
        warehouse: $("ddlCsrWarehouse")?.value || "",
        lmHub: $("ddlCsrHub")?.value || "",
        status: $("ddlCsrFinalStatus")?.value || "",
        startDate: $("dtCsrCreatedFrom")?.value || "",
        endDate: $("dtCsrCreatedTo")?.value || ""
    };
}

async function loadCsrDashboard() {
    if (!isCsrUser()) return;
    try {
        await ensureCsrReferenceData();
        const response = await server("csrDashboard");
        if (!response.success) throw new Error(response.message);
        const data = response.data || {};
        $("csrMetricOpen").textContent = data.open || 0;
        $("csrMetricUnassigned").textContent = data.unassigned || 0;
        $("csrMetricAssigned").textContent = (data.assigned || 0) + (data.inReview ? " / " + data.inReview : "");
        $("csrMetricClosed").textContent = data.closed || 0;
        $("csrMetricCalls").textContent = data.callsDone || 0;
        $("csrMetricAverageResolution").textContent = data.averageResolutionTime || "-";
        $("csrMetricMyRank").textContent = data.myRank ? "#" + data.myRank : "-";
        renderCsrDashboardWork(data.recent || []);
        renderCsrAgentPerformance(data.agentRows || []);
    } catch (error) {
        showToast(error.message || "Unable to load the CSR dashboard.", "error");
    }
}

function renderCsrDashboardWork(tickets) {
    const body = $("csrDashboardWorkBody");
    if (!body) return;
    const visible = isCsrAdmin() ? tickets : tickets.filter(ticket => ticket.currentAssignedAgent === csrMyName());
    body.innerHTML = visible.length ? visible.map(ticket => `<tr>
        <td>${escapeHtml(ticket.ticketId)}</td><td>${escapeHtml(ticket.orderNumber)}</td><td>${escapeHtml(ticket.riderName)}</td>
        <td>${escapeHtml(ticket.zone)}</td><td>${escapeHtml(ticket.lmHub)}</td><td>${statusBadge(ticket.currentStatus)}</td><td>${escapeHtml(ticket.lastActivityAt || "-")}</td>
    </tr>`).join("") : '<tr><td colspan="7">No active work.</td></tr>';
}

function renderCsrAgentPerformance(rows) {
    const body = $("csrAgentPerformanceBody");
    if (!body) return;
    body.innerHTML = rows.length ? rows.map(row => `<tr><td>${escapeHtml(row.name)}</td><td class="center">${escapeHtml(row.openWork)}</td><td class="center">${escapeHtml(row.completedCalls)}</td><td class="center">${escapeHtml(row.averageCallTime || "-")}</td></tr>`).join("") : '<tr><td colspan="4">No CSR calling agents found.</td></tr>';
}

async function initializeCsrQueue() {
    if (!isCsrUser()) return;
    await ensureCsrReferenceData();
    $("csrQueueHeading").textContent = isCsrAdmin() ? "CSR Pending & Assignment" : "My Calling Queue";
    $("csrAssignmentPanel")?.classList.toggle("hidden", !isCsrAdmin());
    await loadCsrQueue();
}

async function loadCsrQueue() {
    if (!isCsrUser()) return;
    try {
        const response = await server(isCsrAdmin() ? "csrAdminQueue" : "csrAgentQueue", csrFilters());
        if (!response.success) throw new Error(response.message);
        APP.csr.tickets = response.data || [];
        renderCsrQueue(APP.csr.tickets);
    } catch (error) {
        showToast(error.message || "Unable to load the CSR queue.", "error");
    }
}

function renderCsrQueue(tickets) {
    const body = $("csrQueueBody");
    if (!body) return;
    const isAdmin = isCsrAdmin();
    body.innerHTML = tickets.length ? tickets.map(ticket => `<tr>
        ${isAdmin ? `<td><input class="csr-ticket-check" type="checkbox" value="${escapeHtml(ticket.ticketId)}" aria-label="Select ${escapeHtml(ticket.ticketId)}"></td>` : ""}
        <td>${escapeHtml(ticket.ticketId)}</td><td>${escapeHtml(ticket.submissionId)}</td><td>${escapeHtml(ticket.orderNumber)}</td><td>${escapeHtml(ticket.riderName)}</td>
        <td>${escapeHtml(ticket.zone)}</td><td>${escapeHtml(ticket.warehouse)}</td><td>${escapeHtml(ticket.lmHub)}</td>
        <td>${statusBadge(ticket.currentStatus)}</td><td>${escapeHtml(ticket.currentAssignedAgent || "-")}</td><td>${escapeHtml(ticket.lastActivityAt || "-")}</td>
        <td><button class="primary-btn csr-open-ticket" data-ticket-id="${escapeHtml(ticket.ticketId)}" type="button">${isAdmin ? "Review / Assign" : "Open Call"}</button></td>
    </tr>`).join("") : `<tr><td colspan="${isAdmin ? 12 : 11}">No CSR tickets found.</td></tr>`;
    body.querySelectorAll(".csr-open-ticket").forEach(button => button.addEventListener("click", () => openCsrTicket(button.dataset.ticketId)));
}

async function assignSelectedCsrTickets() {
    const ticketIds = [...document.querySelectorAll(".csr-ticket-check:checked")].map(box => box.value);
    const agentUsername = $("ddlCsrCallingAgent")?.value || "";
    const slot = Number($("ddlCsrCallSlot")?.value || 1);
    if (!ticketIds.length) return showToast("Select at least one CSR ticket.", "warning");
    if (!agentUsername) return showToast("Select a Calling Agent.", "warning");
    if (!await confirmAction({
        title: "Assign selected tickets?",
        message: "The selected tickets will be assigned for Call " + slot + ".",
        confirmText: "Assign"
    })) return;
    try {
        showLoader("Assigning CSR Tickets", "Please wait while assignments are saved securely.");
        const response = await server("assignCsrTickets", ticketIds, agentUsername, slot);
        if (!response.success) throw new Error(response.message);
        showToast(response.message, "success");
        await loadCsrQueue();
    } catch (error) {
        showToast(error.message || "Unable to assign CSR tickets.", "error");
    } finally {
        hideLoader();
    }
}

async function openCsrTicket(ticketId) {

    if (APP.csrOpening) return;

    APP.csrOpening = true;
    showLoader(
        "Wait, opening your review...",
        "Securing your exclusive CSR review window..."
    );

    try {

        const claimAction = isCsrAdmin()
            ? "claimCsrAdminReview"
            : "claimCsrCallReview";

        const claim = await server(claimAction, ticketId);
        if (!claim.success) throw new Error(claim.message);

        const response = await server("getCsrTicket", ticketId);
        if (!response.success) throw new Error(response.message);

        APP.csr.selectedTicket = response.data;
        navigate("csrReview", "page-pull-up");

    } catch (error) {

        showToast(error.message || "Unable to open the CSR ticket.", "error");

    } finally {

        hideLoader();
        APP.csrOpening = false;

    }
}


async function claimCsrAdminReview() {
    const ticketId = APP.csr.selectedTicket?.ticketId;
    if (!ticketId) return;
    const response = await server("claimCsrAdminReview", ticketId);
    if (!response.success) return showToast(response.message, "error");
    const ticket = await server("getCsrTicket", ticketId);
    if (ticket.success) { APP.csr.selectedTicket = ticket.data; renderCsrReview(); }
}

function renderCsrReview() {
    const ticket = APP.csr.selectedTicket;
    if (!ticket) return;
    $("csrTicketDetails").innerHTML = csrDetailMarkup([
        ["CSR Ticket ID", ticket.ticketId], ["Submission ID", ticket.submissionId], ["Order Number", ticket.orderNumber], ["Rider", ticket.riderName],
        ["Zone", ticket.zone], ["Warehouse", ticket.warehouse], ["LM Hub", ticket.lmHub], ["Reason", ticket.reason],
        ["Current Status", ticket.currentStatus], ["Final Status", ticket.finalStatus], ["Current Assigned Agent", ticket.currentAssignedAgent || "-"], ["Created At", ticket.createdAt]
    ]);
    $("csrRtoContext").innerHTML = csrDetailMarkup([
        ["First Attempt Delivery", ticket.firstAttemptAt], ["Last Attempt Delivery", ticket.lastAttemptAt], ["Prior Submissions", ticket.priorSubmissionCount],
        ["NDR Pushed By", ticket.ndrPushedBy], ["NDR Pushed At", ticket.ndrPushedAt], ["RTO Reviewed By", ticket.rtoReviewedBy], ["RTO Approved On", ticket.rtoApprovedOn], ["RTO Manager Remarks", ticket.rtoManagerRemarks]
    ]);
    $("csrAdminReviewCard")?.classList.toggle("hidden", !isCsrAdmin());
    $("csrAdminReviewMessage").textContent = ticket.reviewOpenedBy ?
        "Review is currently owned by " + ticket.reviewOpenedBy + ". Use the CSR Pending screen to assign the selected call." :
        "Open an exclusive assignment review before using bulk assignment.";
    renderCsrCallCards(ticket);
}

function csrDetailMarkup(entries) {
    return entries.map(([label, value]) => `<div class="csr-detail-item"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value || "-")}</strong></div>`).join("");
}

function renderCsrCallCards(ticket) {
    const container = $("csrCallCards");
    if (!container) return;
    const next = ticket.calls.find(call => call.agentName && !call.remark);
    container.innerHTML = ticket.calls.map(call => {
        const mayCall = isCsrCallingAgent() && next && next.slot === call.slot &&
            String(call.agentName).toLowerCase() === csrMyName().toLowerCase() && ticket.finalStatus === "OPEN";
        const completed = call.remark ? `<div class="csr-call-summary"><strong>${escapeHtml(call.remark)}</strong><span>${escapeHtml(call.completedAt)} · ${escapeHtml(call.completionTime)}</span></div>` : "";
        if (!mayCall) return `<article class="csr-call-card"><h3>Call ${call.slot}</h3><p><b>Assigned to:</b> ${escapeHtml(call.agentName || "Not assigned")}</p><p><b>Assigned at:</b> ${escapeHtml(call.assignedAt || "-")}</p>${completed || '<p class="muted">Awaiting assignment or calling action.</p>'}</article>`;
        const third = call.slot === 3;
        const options = (third ? APP.csr.closingOutcomes : APP.csr.reasons).map(reason => `<option value="${escapeHtml(reason)}">`).join("");
        return `<article class="csr-call-card csr-call-action"><h3>Call ${call.slot}</h3><p>Assigned to you at ${escapeHtml(call.assignedAt || "-")}</p>
          <label>${third ? "Final outcome" : "Quick calling reason"}</label><input id="csrCallReason${call.slot}" class="form-control" list="csrCallOptions${call.slot}" placeholder="Type to search or choose"><datalist id="csrCallOptions${call.slot}">${options}</datalist>
          ${third ? '<p class="form-hint">Call 3 only permits a configured closure outcome.</p>' : `<label>Additional remark (optional)</label><textarea id="csrCallNotes${call.slot}" class="form-control" rows="3" placeholder="Add the calling outcome or note"></textarea>`}
          <button class="primary-btn csr-save-call" data-slot="${call.slot}" type="button">Save Call ${call.slot}</button>
        </article>`;
    }).join("");
    container.querySelectorAll(".csr-save-call").forEach(button => button.addEventListener("click", () => saveCsrCall(Number(button.dataset.slot))));
}

async function saveCsrCall(slot) {
    const ticket = APP.csr.selectedTicket;
    const reason = $("csrCallReason" + slot)?.value.trim() || "";
    const notes = $("csrCallNotes" + slot)?.value.trim() || "";
    try {
        showLoader("Saving Calling Outcome", "Your CSR calling activity is being recorded.");
        const response = await server("completeCsrCall", ticket.ticketId, reason, notes);
        if (!response.success) throw new Error(response.message);
        showToast(response.message, "success");
        const refreshed = await server("getCsrTicket", ticket.ticketId);
        if (refreshed.success) { APP.csr.selectedTicket = refreshed.data; renderCsrReview(); }
    } catch (error) {
        showToast(error.message || "Unable to save the calling outcome.", "error");
    } finally {
        hideLoader();
    }
}

async function loadCsrRepository() {
    if (!isCsrAdmin()) return;
    try {
        const response = await server("csrRepository", csrFilters("repository"));
        if (!response.success) throw new Error(response.message);
        const body = $("csrRepositoryBody");
        const records = response.data || [];
        body.innerHTML = records.length ? records.map(ticket => `<tr><td>${escapeHtml(ticket.ticketId)}</td><td>${escapeHtml(ticket.submissionId)}</td><td>${escapeHtml(ticket.orderNumber)}</td><td>${escapeHtml(ticket.zone)}</td><td>${escapeHtml(ticket.lmHub)}</td><td>${statusBadge(ticket.finalStatus)}</td><td>${escapeHtml(ticket.finalOutcome || "-")}</td><td>${escapeHtml(ticket.currentAssignedAgent || "-")}</td><td>${escapeHtml(ticket.createdAt)}</td><td>${escapeHtml(ticket.closedAt || "-")}</td></tr>`).join("") : '<tr><td colspan="10">No CSR tickets found.</td></tr>';
    } catch (error) {
        showToast(error.message || "Unable to load CSR history.", "error");
    }
}
</script>
