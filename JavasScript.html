<script>

/* ==========================================================
   GLOBAL APPLICATION
========================================================== */

const APP = {

    session : null,

    user : null,

    dashboard : {},

    currentPage : "login",

    loading : false,

    notifications : [],

    configuration : {},

    pendingRequests : [],

    pendingLocations : [],

    bulkUpload : {
        locations: [],
        accessScope: "",
        currentLocation: {}
    },

    repositoryResults : [],

    repositoryResultMode : "submissions",

    repositoryDateRange : {
        start: "",
        end: ""
    },

    csr : {
        tickets: [],
        locations: [],
        agents: [],
        reasons: [],
        closingOutcomes: [],
        selectedTicket: null
    },

    version : "1.0.0"

};



/* ==========================================================
   DOM READY
========================================================== */

document.addEventListener("DOMContentLoaded", initializeApplication);



/* ==========================================================
   INITIALIZE
========================================================== */

function initializeApplication(){

    APP.session = sessionStorage.getItem("rtoSession") || null;

    applyAppBranding();
    initializeEvents();
    initializeCsrEvents();
    initializePasswordToggle();
    validateSession();
    loadRememberedUser();
    

}

function initializePasswordToggle() {

    const password =
        document.getElementById("loginPassword");

    const button =
        document.getElementById("togglePassword");

    const icon =
        button?.querySelector(".material-symbols-outlined");

    if (!password || !button || !icon) return;

    button.addEventListener("click", () => {

        if (password.type === "password") {

            password.type = "text";
            icon.textContent = "visibility_off";

        } else {

            password.type = "password";
            icon.textContent = "visibility";

        }

    });

}
/* ==========================================================
   REMEMBER USERNAME
========================================================== */

function loadRememberedUser() {

    const username =
        localStorage.getItem("rememberUsername");

    const remember =
        localStorage.getItem("rememberMe");

    if (remember === "true" && username) {

        document.getElementById("loginUsername").value = username;

        document.getElementById("rememberMe").checked = true;

    }

}

function saveRememberedUser(username) {

    const remember =
        document.getElementById("rememberMe").checked;

    if (remember) {

        localStorage.setItem("rememberUsername", username);

        localStorage.setItem("rememberMe", "true");

    } else {

        localStorage.removeItem("rememberUsername");

        localStorage.removeItem("rememberMe");

    }

}
/* ==========================================================
   EVENTS
========================================================== */

function initializeEvents() {

    /* Login */

    document
        .getElementById("btnLogin")
        ?.addEventListener("click", login);

    /* Login using Enter key */

    ["loginUsername", "loginPassword"].forEach(id => {

        document
            .getElementById(id)
            ?.addEventListener("keydown", function (e) {

                if (e.key === "Enter") {

                    e.preventDefault();

                    login();

                }

            });

    });

    /* Logout */

    document
        .getElementById("btnLogout")
        ?.addEventListener("click", logout);

    document
        .getElementById("toggleDarkMode")
        ?.addEventListener("change", event => {
            setDarkMode(event.target.checked);
        });

    document
        .getElementById("ddlUiLanguage")
        ?.addEventListener("change", event => {
            setUiLanguage(event.target.value, true);
        });

}
/* ==========================================================
   GLOBAL LOADER
========================================================== */

function showLoader(title = "Loading...", message = "Please wait...") {

    APP.loading = true;

    const overlay = document.getElementById("loaderOverlay");

    if (!overlay) return;

    const titleElement = document.getElementById("loaderTitle");
    const messageElement = document.getElementById("loaderMessage");

    if (titleElement) {
        titleElement.textContent = title;
    }

    if (messageElement) {
        messageElement.textContent = message;
    }

    overlay.classList.remove("hidden");
    overlay.classList.add("active");

}

function hideLoader() {

    APP.loading = false;

    const overlay = document.getElementById("loaderOverlay");

    if (!overlay) return;

    overlay.classList.remove("active");
    overlay.classList.add("hidden");

}

/* ==========================================================
   TOAST
========================================================== */

function showToast(message,type="info"){

    const container =
        document.getElementById("toastContainer");

    if(!container) return;

    const toast =
        document.createElement("div");

    toast.className =
        "toast toast-" + type;

    const content = document.createElement("span");
    content.textContent = String(message || "");

    const closeButton = document.createElement("button");
    closeButton.type = "button";
    closeButton.setAttribute("aria-label", "Dismiss notification");
    closeButton.textContent = "×";
    closeButton.onclick = () => toast.remove();

    toast.append(content, closeButton);

    container.appendChild(toast);

    setTimeout(()=>{

        toast.remove();

    },4000);

}
/* ==========================================================
   PAGE NAVIGATION
========================================================== */

function showPage(page, transitionClass) {

    document.querySelectorAll(".page").forEach(section => {
        section.classList.remove("active", "page-enter", "page-pull-up");
        section.classList.add("hidden");
    });

    document.querySelectorAll(".menu-item").forEach(button => {
        button.classList.remove("active");
    });

    const pageMap = {
        riderDashboard: "dashboardView",
        riderSubmission: "submissionView",
        mySubmission: "mySubmissionView",
        pendingRequest: "pendingView",
        reviewRequest: "reviewView",
        adminDashboard: "adminView",
        adminRepository: "repositoryView",
        notifications: "notificationView",
        settings: "settingsView",
        csrDashboard: "csrDashboardView",
        csrPending: "csrPendingView",
        csrReview: "csrReviewView",
        csrRepository: "csrRepositoryView"
    };

    const view = document.getElementById(pageMap[page]);

    if (view) {
        view.classList.remove("hidden");
        void view.offsetWidth;
        view.classList.add("active", transitionClass || "page-enter");
    }

    document
        .querySelector(`[data-page="${page}"]`)
        ?.classList.add("active");

    document.querySelector(".content-wrapper")
        ?.scrollTo({ top: 0, left: 0, behavior: "auto" });

    APP.currentPage = page;
}

/* ==========================================================
   API
========================================================== */

function server(functionName, ...args) {

    return new Promise((resolve, reject) => {

        google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject)
            .apiCall(functionName, APP.session || "", ...args);

    });

}

/* ==========================================================
   SESSION
========================================================== */

async function validateSession(){

    try{

        const response =
            await server("validateSession", APP.session);

        if(response.success){

            APP.session = response.data.sessionId;

            APP.user = response.data.user;

            afterLogin();

        }else{

            sessionStorage.removeItem("rtoSession");
            showLogin();

        }

    }catch(error){

        sessionStorage.removeItem("rtoSession");
        showLogin();

    }

}

/* ==========================================================
   LOGIN SCREEN
========================================================== */

function showLogin(){

    document
        .getElementById("loginPage")
        ?.classList.remove("hidden");

    document

        .getElementById("loginContainer")

        ?.classList.remove("hidden");

    document

        .getElementById("appContainer")

        ?.classList.add("hidden");

}



/* ==========================================================
   AFTER LOGIN
========================================================== */

function afterLogin() {

    document.getElementById("loginPage")?.classList.add("hidden");
    document.getElementById("appContainer")?.classList.remove("hidden");

    loadLoggedInUser();

    const role = normaliseRole(APP.user.role);

    if (isCsrUser()) {

        navigate(isCsrAdmin() ? "csrDashboard" : "csrDashboard");
        return;

    }

    if (role === "RIDER") {

        navigate("riderDashboard");

    } else if (role === "MANAGER" || role === "HUB_MANAGER") {

        navigate("pendingRequest");

    } else if (role === "ADMIN" || role === "SUPER_ADMIN") {

        navigate("adminDashboard");

    } else {

        navigate("riderDashboard");

    }

}
/* ==========================================================
   USER
========================================================== */

function avatarProfileForRole(role){

    switch(normaliseRole(role)){

        case "RIDER":
            return { className: "avatar-rider", icon: "two_wheeler", label: "Rider" };

        case "MANAGER":
        case "HUB_MANAGER":
            return { className: "avatar-manager", icon: "business_center", label: "Manager" };

        case "ADMIN":
            return { className: "avatar-admin", icon: "admin_panel_settings", label: "Administrator" };

        case "SUPER_ADMIN":
            return { className: "avatar-super-admin", icon: "workspace_premium", label: "Super administrator" };

        case "CALLING_AGENT":
            return { className: "avatar-calling-agent", icon: "headset_mic", label: "Calling agent" };

        default:
            return { className: "avatar-default", icon: "account_circle", label: "User" };

    }

}

function renderRoleAvatar(avatar, role, userName){

    const profile = avatarProfileForRole(role);

    avatar.className = "user-avatar role-avatar " + profile.className;
    avatar.replaceChildren();
    avatar.setAttribute("aria-label", (userName || "User") + ": " + profile.label);
    avatar.title = profile.label;

    const icon = document.createElement("span");
    icon.className = "material-symbols-outlined avatar-icon";
    icon.textContent = profile.icon;
    icon.setAttribute("aria-hidden", "true");

    avatar.appendChild(icon);

}

function renderSidebarUserAvatar(userName, role, profilePhoto){

    const avatar = document.getElementById("userAvatar");

    if (!avatar) return;

    const photoUrl = String(profilePhoto || "").trim();

    if (!/^https:\/\//i.test(photoUrl)) {
        renderRoleAvatar(avatar, role, userName);
        return;
    }

    avatar.className = "user-avatar has-profile-photo";
    avatar.replaceChildren();
    avatar.setAttribute("aria-label", (userName || "User") + " profile photo");
    avatar.title = userName || "User";

    const image = document.createElement("img");
    image.className = "avatar-profile-photo";
    image.src = photoUrl;
    image.alt = (userName || "User") + " profile photo";
    image.addEventListener("error", () => {
        if (avatar.contains(image)) {
            renderRoleAvatar(avatar, role, userName);
        }
    }, { once: true });

    avatar.appendChild(image);

}

function loadLoggedInUser(){

    if (!APP.user) return;

    const userName =
        APP.user.name ||
        APP.user.riderName ||
        APP.user.username ||
        "User";

    const userRole =
        APP.user.role || "";

    /* Sidebar */

    const nameElement =
        document.getElementById("loggedUserName");

    const roleElement =
        document.getElementById("loggedUserRole");

    if(nameElement){

        nameElement.textContent = userName;

    }

    if(roleElement){

        roleElement.textContent = userRole;

    }

    renderSidebarUserAvatar(
        userName,
        userRole,
        APP.user.profilePhoto
    );

    loadUserUiLanguagePreference();

    /* Dashboard */

    const dashboardUser =
        document.getElementById("dashboardUserName");

    if(dashboardUser){

        dashboardUser.textContent = userName;

    }

    configureRoleMenus();

}
/* ==========================================================
   LOGIN
========================================================== */

async function login() {

    const username =
        document.getElementById("loginUsername").value.trim();

    const password =
        document.getElementById("loginPassword").value;

    if (!username) {

        showToast(
            "Username is required",
            "warning"
        );

        return;

    }

    if (!password) {

        showToast(
            "Password is required",
            "warning"
        );

        return;

    }

    try {

        /* Show Login Loader */

        showLoader(
            "Signing In...",
            "Authenticating your account..."
        );

        const response =
            await server(
                "login",
                username,
                password
            );

        if (response.success) {

            APP.session = response.data.sessionId;
            APP.user = response.data;
            sessionStorage.setItem("rtoSession", APP.session);

            saveRememberedUser(username);

            /* Update Loader */

            showLoader(
                `Welcome, ${APP.user.name || APP.user.username || username} 👋`,
                "Preparing your workspace..."
            );

            setTimeout(() => {

    showToast(
        response.message,
        "success"
    );

    afterLogin();

    hideLoader();

}, 1200);

        } else {

            hideLoader();

            showToast(
                response.message,
                "error"
            );

        }

    } catch (error) {

        hideLoader();

        showToast(
            error.message || "Unable to login.",
            "error"
        );

    }

}
/* ==========================================================
   LOGOUT
========================================================== */

async function logout(){

    if (!(await confirmAction({
        title: "Log out?",
        message: "Your current session will be securely closed.",
        confirmText: "Yes, log out",
        cancelText: "Stay signed in"
    }))) {
        return;
    }

    showLoader(
        "Thanks, come again!",
        "We are securely signing you out..."
    );

    try{

        if (APP.user?.username) {
            await server("logout", APP.user.username);
        }

    }catch(e){}

    APP.session = null;

    APP.user = null;

    sessionStorage.removeItem("rtoSession");

    hideLoader();

    showLogin();

}



/* ==========================================================
   END PART 1
========================================================== */

</script>
<script>

/* ==========================================================
   SIDEBAR NAVIGATION
========================================================== */

function initializeNavigation(){

    document.getElementById("btnMobileMenuToggle")?.addEventListener("click", event => {
        const isOpen = document.getElementById("sidebar")?.classList.toggle("open") || false;
        event.currentTarget.setAttribute("aria-expanded", String(isOpen));
    });

    document.querySelectorAll("[data-page]").forEach(button=>{

        button.addEventListener("click",function(){

            const page=this.dataset.page;

            navigate(page);

            if (window.matchMedia("(max-width: 768px)").matches) {
                document.getElementById("sidebar")?.classList.remove("open");
                document.getElementById("btnMobileMenuToggle")?.setAttribute("aria-expanded", "false");
            }

        });

    });

}



function navigate(page, transitionClass){

    showPage(page, transitionClass);

    switch(page){

        case "riderDashboard":

            loadRiderDashboard();

            break;

        case "riderSubmission":

            initializeSubmission();

            break;

        case "mySubmission":

            loadMySubmission();

            break;

        case "pendingRequest":

            loadPendingRequest();

            break;

        case "reviewRequest":

            resetReviewScreen();

            break;

        case "adminDashboard":

            loadAdminDashboard();

            break;

        case "adminRepository":

            initializeRepository();

            break;

        case "notifications":

            loadNotifications();

            break;

        case "settings":

            loadSettings();

            break;

        case "csrDashboard":

            loadCsrDashboard();

            break;

        case "csrPending":

            initializeCsrQueue();

            break;

        case "csrReview":

            renderCsrReview();

            break;

        case "csrRepository":

            loadCsrRepository();

            break;

    }

}

function initializeRepository(){

    $("#txtRepositorySearch")?.focus();
    updateRepositoryExportButtons();

}
/* ==========================================================
   ROLE BASED MENUS
========================================================== */

function setMenuVisibility(selector, visible){

    document.querySelectorAll(selector).forEach(element => {

        element.hidden = !visible;
        element.classList.toggle("hidden", !visible);

    });

}

function configureRoleMenus(){

    setMenuVisibility(
        ".managerOnly,.adminOnly,.superAdminOnly,.csrOnly,.csrAdminOnly,.csrAgentOnly,[data-rto-roles]",
        false
    );

    if (isCsrUser()) {

        setMenuVisibility(".rtoOnly", false);
        setMenuVisibility(".csrOnly", true);
        setMenuVisibility(isCsrAdmin() ? ".csrAdminOnly" : ".csrAgentOnly", true);

        return;

    }

    setMenuVisibility(".rtoOnly", true);

    const role = normaliseRole(APP.user?.role);

    /*
       Quick-action buttons use the managerOnly/adminOnly markers but do not
       carry data-rto-roles.  Show them only after the baseline has hidden all
       privileged controls; the navigation buttons below are then governed by
       their stricter data-rto-roles allow-list.
    */
    const manager = ["HUB_MANAGER", "MANAGER", "ADMIN", "SUPER_ADMIN"].includes(role);
    const admin = ["ADMIN", "SUPER_ADMIN"].includes(role);

    setMenuVisibility(".managerOnly", manager);
    setMenuVisibility(".adminOnly", admin);
    setMenuVisibility(".superAdminOnly", role === "SUPER_ADMIN");

    document.querySelectorAll("[data-rto-roles]").forEach(element => {

        const allowedRoles = String(element.dataset.rtoRoles || "")
            .split(",")
            .map(normaliseRole);
        const visible = allowedRoles.includes(role);

        element.hidden = !visible;
        element.classList.toggle("hidden", !visible);

    });

}

function normaliseRole(role) {

    return String(role || "")
        .trim()
        .toUpperCase()
        .replace(/\s+/g, "_");

}

function isAdminUser() {

    const role = normaliseRole(APP.user?.role);

    return role === "ADMIN" || role === "SUPER_ADMIN";

}
/* ==========================================================
   RIDER DASHBOARD
========================================================== */

async function loadRiderDashboard(){

    try{

        const response =

    await server(

        "dashboardCounts",

        APP.user?.username

    );

        if(!response.success){

            showToast(

                response.message,

                "error"

            );

            return;

        }

        APP.dashboard=response.data;

        populateDashboardCounts();

        loadRecentSubmissions();

        loadNotificationCount();

    }

    catch(error){

        showToast(

            error.message,

            "error"

        );

    }

}

/* ==========================================================
   DASHBOARD COUNTS
========================================================== */

function populateDashboardCounts(){

    const counts = APP.dashboard || {};

    $("#dashboardTotal").textContent =
        counts.total || 0;

    $("#dashboardPending").textContent =
        counts.pending || 0;

    $("#dashboardUnderReview").textContent =
        counts.underReview || 0;

    $("#dashboardApproved").textContent =
        counts.approved || 0;

    $("#dashboardRejected").textContent =
        counts.rejected || 0;

}

/* ==========================================================
   RECENT SUBMISSIONS
========================================================== */

async function loadRecentSubmissions(){

    try{

        const response=

            await server(

                "mySubmissions",

                APP.user?.username

            );

        if(!response.success){

            return;

        }

        renderRecentSubmissions(

            response.data

        );

    }

    catch(error){

        console.error(error);

    }

}



function renderRecentSubmissions(data){

    const tbody=

        $("#recentSubmissionTable");

    tbody.innerHTML="";

    if(!data.length){

        tbody.innerHTML=

        `<tr>

            <td colspan="4">

                No Records Found

            </td>

        </tr>`;

        return;

    }

    data.slice(0,5).forEach(item=>{

        tbody.insertAdjacentHTML(

            "beforeend",

            `

            <tr>

                <td>${escapeHtml(item.submissionId)}</td>

                <td>${escapeHtml(item.orderNumber)}</td>

                <td>

                    ${statusBadge(item.status)}

                </td>

                <td>${escapeHtml(item.timestamp)}</td>

            </tr>

            `

        );

    });

}



/* ==========================================================
   NOTIFICATION COUNT
========================================================== */

async function loadNotificationCount(){

    try{

        const response=

            await server(

                "unreadNotificationCount",

                APP.user?.username

            );

        if(!response.success){

            return;

        }

        const badge=

            $("#notificationBadge");

        if(!badge){

            return;

        }

        badge.textContent=

            response.data;

        badge.style.display=

            response.data>0

            ? "inline-flex"

            : "none";

    }

    catch(error){

        console.error(error);

    }

}



/* ==========================================================
   REFRESH
========================================================== */

function refreshDashboard(){

    loadRiderDashboard();

}



/* ==========================================================
   SESSION WATCH
========================================================== */

setInterval(async()=>{

    if(!APP.session){

        return;

    }

    try{

        const response=

            await server(

                "validateSession",

                APP.session

            );

        if(!response.success){

            showToast(

                "Session Expired",

                "warning"

            );

            logout();

        }

    }

    catch(error){

        console.error(error);

    }

},300000);



/* ==========================================================
   COMMON HELPERS
========================================================== */

function $(id){

    if (!id) return null;

    return id.startsWith("#")
        ? document.querySelector(id)
        : document.getElementById(id);

}

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");

}

function safeExternalUrl(value){

    try {
        const url = new URL(String(value || ""));
        return ["https:", "http:"].includes(url.protocol) ? url.href : "";
    } catch (error) {
        return "";
    }

}



/*============================================================
    STATUS BADGE
============================================================*/

function statusBadge(status) {

    status = String(status || "").trim();

    let css = "badge-secondary";
    let icon = "";

    switch (status.toUpperCase()) {

        case "SUBMITTED":
            css = "badge-primary";
            icon = "🟡 ";
            break;

        case "UNDER REVIEW":
            css = "badge-warning";
            icon = "🔵 ";
            break;

        case "APPROVED":
            css = "badge-success";
            icon = "🟢 ";
            break;

        case "REJECTED":
            css = "badge-danger";
            icon = "🔴 ";
            break;

        case "OPEN":
        case "CALLING PENDING":
            css = "badge-primary";
            icon = "🔵 ";
            break;

        case "CLOSED":
            css = "badge-success";
            icon = "🟢 ";
            break;

    }

    return `
        <span class="status-badge ${css}" aria-label="Status: ${escapeHtml(status)}">
            <span class="status-indicator" aria-hidden="true">${icon}</span>
            <span class="status-label">${escapeHtml(status)}</span>
        </span>
    `;

}

/* ==========================================================
   INITIALIZATION
========================================================== */

document.addEventListener(

    "DOMContentLoaded",

    ()=>{

        initializeNavigation();

    }

);

/* ==========================================================
   END PART 2
========================================================== */

</script>
<script>

/* ==========================================================
   RIDER SUBMISSION
========================================================== */

async function initializeSubmission(){

    clearSubmissionForm();

    await loadReasons();

    if (isAdminUser()) {
        await initializeBulkUpload();
    }

    const orderBox = $("#txtOrderNumber");

    if(orderBox){

        /* ---------- Typing ---------- */

        orderBox.oninput = function(){

            this.value = this.value
                .replace(/[^0-9]/g,"")
                .substring(0,11);

        };

        /* ---------- Paste ---------- */

        orderBox.onpaste = function(e){

            e.preventDefault();

            const text = (e.clipboardData || window.clipboardData)
                .getData("text");

            this.value = text
                .replace(/[^0-9]/g,"")
                .substring(0,11);

        };

    }

}

/* ==========================================================
   LOAD REASONS
========================================================== */

async function loadReasons(){

    const ddl = $("#ddlReason");

    if (!ddl) {

        return [];

    }

    const previousValue = ddl.value;

    /*
       Show a real loading state.  On a phone this prevents a user from
       tapping an empty native select before the Apps Script request ends.
    */
    ddl.disabled = true;
    ddl.setAttribute("aria-busy", "true");
    ddl.innerHTML = `<option value="">Loading reasons…</option>`;
    setReasonSearchLoading();

    try{

        const response = await server("getReasons");

        if(!response || !response.success){

            throw new Error(response?.message || "Unable to load reasons.");

        }

        APP.reasons = Array.isArray(response.data)
            ? response.data.filter(item => item && item.reason)
            : [];

        ddl.innerHTML = `
            <option value="">
                Select Reason
            </option>
        `;

        APP.reasons.forEach(item => {

            const option = document.createElement("option");
            option.value = item.reason;
            option.textContent = item.reason;
            ddl.appendChild(option);

        });

        if (previousValue && APP.reasons.some(item => item.reason === previousValue)) {

            ddl.value = previousValue;

        }

        syncReasonSearchValue(ddl.value);
        renderReasonSearchResults(APP.reasons, "");

        if (!APP.reasons.length) {

            ddl.innerHTML = `<option value="">No reasons are available for this account</option>`;
            renderReasonSearchResults([], "", "No reasons are available for this account.");
            showToast("No active reasons are assigned to your role.", "error");

        }

        return APP.reasons;

    }

    catch(error){

        APP.reasons = [];
        ddl.innerHTML = `<option value="">Unable to load reasons — reopen this page</option>`;
        renderReasonSearchResults([], "", "Unable to load reasons. Reopen this page.");
        showToast(error?.message || "Unable to load reasons.","error");

        return [];

    }

    finally {

        ddl.disabled = false;
        ddl.removeAttribute("aria-busy");

    }

}

/* ==========================================================
   SEARCHABLE REASON PICKER
   Uses normal input and button elements instead of a native select popup.
   The hidden select remains the source of truth for existing submission logic.
========================================================== */

function getReasonSearchElements(){

    return {
        ddl: $("#ddlReason"),
        input: $("#txtReasonSearch"),
        list: $("#reasonSearchList")
    };

}

function closeReasonSearchList(){

    getReasonSearchElements().list?.classList.add("hidden");

}

function syncReasonSearchValue(value){

    const picker = getReasonSearchElements();

    if (!picker.input) return;

    picker.input.value = value || "";
    picker.input.placeholder = "Type to search a reason";

}

function setReasonSearchLoading(){

    const picker = getReasonSearchElements();

    if (!picker.input || !picker.list) return;

    picker.input.disabled = true;
    picker.input.value = "";
    picker.input.placeholder = "Loading reasons...";
    picker.list.replaceChildren();

    const message = document.createElement("p");
    message.className = "reason-search-empty";
    message.textContent = "Loading reasons...";
    picker.list.appendChild(message);

    closeReasonSearchList();

}

function renderReasonSearchResults(reasons, query, emptyMessage){

    const picker = getReasonSearchElements();

    if (!picker.ddl || !picker.input || !picker.list) return;

    const normalizedQuery = String(query || "").trim().toLowerCase();
    const items = (Array.isArray(reasons) ? reasons : [])
        .filter(item => item && item.reason)
        .filter(item => String(item.reason).toLowerCase().includes(normalizedQuery));

    picker.list.replaceChildren();
    picker.input.disabled = !Array.isArray(reasons) || !reasons.length;

    if (!items.length) {

        const message = document.createElement("p");
        message.className = "reason-search-empty";
        message.textContent = emptyMessage || (normalizedQuery
            ? "No matching reason found."
            : "No reasons are available for this account.");
        picker.list.appendChild(message);
        return;

    }

    items.forEach(item => {

        const option = document.createElement("button");
        option.type = "button";
        option.className = "reason-search-option";
        option.setAttribute("role", "option");
        option.setAttribute("aria-selected", String(picker.ddl.value === item.reason));
        option.textContent = item.reason;

        option.addEventListener("click", function(){

            picker.ddl.value = item.reason;
            picker.ddl.dispatchEvent(new Event("change", { bubbles:true }));
            syncReasonSearchValue(item.reason);
            closeReasonSearchList();

        });

        picker.list.appendChild(option);

    });

}

function initializeReasonSearch(){

    const picker = getReasonSearchElements();

    if (!picker.input || !picker.list || picker.input.dataset.initialized === "true") return;

    picker.input.dataset.initialized = "true";

    picker.input.addEventListener("focus", function(){

        const reasons = Array.isArray(APP.reasons) ? APP.reasons : [];

        if (!reasons.length) {
            loadReasons();
            return;
        }

        renderReasonSearchResults(reasons, picker.input.value);
        picker.list.classList.remove("hidden");

    });

    picker.input.addEventListener("input", function(){

        renderReasonSearchResults(APP.reasons, picker.input.value);
        picker.list.classList.remove("hidden");

    });

    picker.input.addEventListener("keydown", function(event){

        if (event.key === "Escape") {
            closeReasonSearchList();
        }

    });

    document.addEventListener("click", function(event){

        const group = picker.input.closest(".reason-search-group");

        if (group && !group.contains(event.target)) {
            closeReasonSearchList();
        }

    });

    setReasonSearchLoading();

}

initializeReasonSearch();

/* ==========================================================
   ATTACHMENT PREVIEW AND CLIENT-SIDE FILE VALIDATION
========================================================== */

const FILE_PREVIEW_TYPES = {
    image: ["jpg", "jpeg", "png", "webp", "gif", "bmp", "heic", "heif"],
    video: ["mp4", "mov", "avi", "mkv", "webm", "3gp", "3gpp"],
    audio: ["mp3", "wav", "aac", "m4a", "ogg", "amr", "3gp", "3gpp"],
    pdf: ["pdf"]
};

function fileExtension(file){

    const name = String(file && file.name || "");
    const match = name.toLowerCase().match(/\.([a-z0-9]+)$/);
    return match ? match[1] : "";

}

function fileKind(file){

    const type = String(file && file.type || "").toLowerCase();
    const extension = fileExtension(file);

    if (type.indexOf("image/") === 0 || FILE_PREVIEW_TYPES.image.indexOf(extension) !== -1)
        return "image";

    if (type.indexOf("video/") === 0 || FILE_PREVIEW_TYPES.video.indexOf(extension) !== -1)
        return "video";

    if (type.indexOf("audio/") === 0 || FILE_PREVIEW_TYPES.audio.indexOf(extension) !== -1)
        return "audio";

    if (type === "application/pdf" || FILE_PREVIEW_TYPES.pdf.indexOf(extension) !== -1)
        return "pdf";

    return "";

}

function canonicalFileMimeType(file){

    const type = String(file && file.type || "").toLowerCase();
    const extension = fileExtension(file);

    if (type && type !== "application/octet-stream") return type;

    const mimeByExtension = {
        jpg: "image/jpeg", jpeg: "image/jpeg", png: "image/png",
        webp: "image/webp", gif: "image/gif", bmp: "image/bmp",
        heic: "image/heic", heif: "image/heif", pdf: "application/pdf",
        mp3: "audio/mpeg", wav: "audio/wav", aac: "audio/aac",
        m4a: "audio/mp4", ogg: "audio/ogg", amr: "audio/amr",
        mp4: "video/mp4", mov: "video/quicktime", avi: "video/x-msvideo",
        mkv: "video/x-matroska", webm: "video/webm", "3gp": "video/3gpp",
        "3gpp": "video/3gpp"
    };

    return mimeByExtension[extension] || type || "";

}

function formatFileSize(bytes){

    const size = Number(bytes) || 0;
    if (size < 1024) return size + " B";
    if (size < 1024 * 1024) return (size / 1024).toFixed(1) + " KB";
    return (size / (1024 * 1024)).toFixed(1) + " MB";

}

function resetFilePreview(previewId){

    const preview = $(previewId);
    if (!preview) return;

    if (preview.dataset.objectUrl) {
        URL.revokeObjectURL(preview.dataset.objectUrl);
        delete preview.dataset.objectUrl;
    }

    delete preview.dataset.invalid;
    preview.className = "file-preview preview-empty";
    preview.replaceChildren();

    const placeholder = document.createElement("span");
    placeholder.className = "file-preview-placeholder";
    placeholder.textContent = "No file selected";
    preview.appendChild(placeholder);

}

function setUnsupportedFilePreview(input, previewId, file){

    const preview = $(previewId);
    if (!preview) return;

    resetFilePreview(previewId);
    preview.dataset.invalid = "true";
    preview.className = "file-preview preview-error";
    preview.replaceChildren();

    const title = document.createElement("strong");
    title.textContent = "Unsupported file";
    const detail = document.createElement("span");
    detail.textContent = (file && file.name ? file.name + ". " : "") +
        "Choose an Image, Video, Audio, or PDF file.";

    preview.append(title, detail);
    input.setCustomValidity("Unsupported file type. Choose an Image, Video, Audio, or PDF file.");

}

function previewImage(input, previewId){

    const preview = $(previewId);
    const file = input && input.files && input.files[0];

    if (!preview) return true;

    resetFilePreview(previewId);

    if (!file) {
        if (input) input.setCustomValidity("");
        return true;
    }

    const kind = fileKind(file);
    if (!kind) {
        setUnsupportedFilePreview(input, previewId, file);
        return false;
    }

    input.setCustomValidity("");
    preview.className = "file-preview preview-ready";

    const fileMeta = document.createElement("div");
    fileMeta.className = "file-preview-meta";

    const fileName = document.createElement("strong");
    fileName.textContent = file.name || "Selected attachment";
    const fileSize = document.createElement("span");
    fileSize.textContent = formatFileSize(file.size);
    fileMeta.append(fileName, fileSize);

    const mediaWrap = document.createElement("div");
    mediaWrap.className = "file-preview-media";
    const objectUrl = URL.createObjectURL(file);
    preview.dataset.objectUrl = objectUrl;

    if (kind === "image") {
        const image = document.createElement("img");
        image.alt = "Preview of " + (file.name || "selected image");
        image.src = objectUrl;
        image.className = "attachment-image-preview";
        mediaWrap.appendChild(image);
    }

    if (kind === "video") {
        const video = document.createElement("video");
        video.src = objectUrl;
        video.controls = true;
        video.preload = "metadata";
        video.playsInline = true;
        video.className = "attachment-video-preview";
        mediaWrap.appendChild(video);
    }

    if (kind === "audio") {
        const audio = document.createElement("audio");
        audio.src = objectUrl;
        audio.controls = true;
        audio.preload = "metadata";
        audio.className = "attachment-audio-preview";
        mediaWrap.appendChild(audio);
    }

    if (kind === "pdf") {
        const frame = document.createElement("iframe");
        frame.src = objectUrl;
        frame.title = "Preview of " + (file.name || "selected PDF");
        frame.className = "attachment-pdf-preview";
        mediaWrap.appendChild(frame);

        const openButton = document.createElement("button");
        openButton.type = "button";
        openButton.className = "preview-open-file";
        openButton.textContent = "Open PDF";
        openButton.addEventListener("click", function(){
            window.open(objectUrl, "_blank", "noopener");
        });
        mediaWrap.appendChild(openButton);
    }

    preview.replaceChildren(fileMeta, mediaWrap);
    return true;

}

function selectedFileIsValid(input, previewId, fieldName){

    const file = input && input.files && input.files[0];
    if (!file) return true;

    if (fileKind(file)) return true;

    setUnsupportedFilePreview(input, previewId, file);
    showToast(fieldName + " must be an Image, Video, Audio, or PDF file.", "warning");
    return false;

}



/* ==========================================================
   IMAGE COMPRESSION
========================================================== */

function compressImage(file,maxWidth=1280,quality=.75){

    return new Promise((resolve,reject)=>{

        const reader=new FileReader();

        reader.onload=function(event){

            const image=new Image();

            image.onload=function(){

                const canvas=document.createElement("canvas");

                let width=image.width;

                let height=image.height;

                if(width>maxWidth){

                    height*=maxWidth/width;

                    width=maxWidth;

                }

                canvas.width=width;

                canvas.height=height;

                const context=canvas.getContext("2d");

                context.drawImage(

                    image,

                    0,

                    0,

                    width,

                    height

                );

                canvas.toBlob(

                    blob=>{

                        if (blob) resolve(blob);
                        else reject(new Error("Unable to compress the selected image."));

                    },

                    "image/jpeg",

                    quality

                );

            };

            image.src=event.target.result;

        };

        reader.onerror=reject;

        reader.readAsDataURL(file);

    });

}



/* ==========================================================
   UPLOAD FILE
========================================================== */

function readAsDataUrl(file, fallbackMimeType){

    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = event => {

            let dataUrl = String(event.target.result || "");

            // Some Android file pickers provide an empty MIME type. FileReader
            // then emits application/octet-stream, which Drive-side validation
            // correctly rejects. Use the verified filename fallback instead.
            if (fallbackMimeType && /^data:application\/octet-stream;base64,/i.test(dataUrl)) {
                dataUrl = dataUrl.replace(
                    /^data:application\/octet-stream;base64,/i,
                    "data:" + fallbackMimeType + ";base64,"
                );
            }

            resolve(dataUrl);

        };
        reader.onerror = () => reject(new Error("Unable to read the selected file."));
        reader.readAsDataURL(file);
    });

}

async function uploadFile(file, folderName){

    const kind = fileKind(file);
    const sourceMimeType = canonicalFileMimeType(file);

    if (!kind || !sourceMimeType) {
        throw new Error("Unsupported file type. Choose an Image, Video, Audio, or PDF file.");
    }

    let upload = file;
    let uploadName = file.name;

    if (file.type.startsWith("image/") && !/image\/(heic|heif)/i.test(file.type)) {
        try {
            upload = await compressImage(file);
            uploadName = file.name.replace(/\.[^.]+$/, "") + ".jpg";
        } catch (error) {
            upload = file;
        }
    }

    const uploadMimeType = canonicalFileMimeType(upload) || sourceMimeType;

    // Base64 requests are larger than the local file. Keep them inside the
    // reliable Apps Script request size while the server still enforces its
    // configured upload limit.
    if (upload.size > 25 * 1024 * 1024) {
        throw new Error("This file is too large to upload. Choose a file smaller than 25 MB.");
    }

    let response;

    try {
        response = await server(
            "uploadFile",
            await readAsDataUrl(upload, uploadMimeType),
            uploadName,
            folderName
        );
    } catch (error) {
        throw new Error(
            (error && error.message) ||
            "The file could not be uploaded. Check your connection and try again."
        );
    }

    if (!response || !response.success)
        throw new Error(
            (response && response.message) ||
            "The file could not be uploaded. Check your connection and try again."
        );

    return response.data.fileUrl;

}

async function submitRequest() {

    const orderNumber =
        $("#txtOrderNumber")
        .value
        .trim()
        .toUpperCase();

    const reason =
        $("#ddlReason")
        .value;

    const mandatory =
        $("#mandatoryProof")
        .files[0];

    const optional =
        $("#optionalProof")
        .files[0];

    if (!orderNumber) {

        showToast(
            "Order Number is required",
            "warning"
        );

        return;

    }

    if (!validateOrderNumber(orderNumber)) {

        showToast(
            "Order Number must contain 1 to 11 digits.",
            "warning"
        );

        return;

    }

    if (!reason) {

        showToast(
            "Please select a reason.",
            "warning"
        );

        return;

    }

    if (!selectedFileIsValid(mandatory, "mandatoryPreview", "Mandatory Proof") ||
        !selectedFileIsValid(optional, "optionalPreview", "Optional Proof")) {

        return;

    }

            const config =
                APP.reasons.find(r => r.reason === reason);

            if (config?.mandatoryProof && !isAdminUser() && !mandatory) {

                showToast(
                    "Mandatory proof is required.",
                    "warning"
                );

                return;

            }

    try {

        showLoader(
            "Wait, your files are getting uploaded...",
            "Please keep this page open while we securely upload your attachments."
        );

                /* ---------- Upload Mandatory Proof ---------- */

                let mandatoryUpload = "";

                if (mandatory) {

                    mandatoryUpload =
                        await uploadFile(
                            mandatory,
                            "Mandatory Proofs"
                        );

                }

                /* ---------- Upload Optional Proof ---------- */

                let optionalUpload = "";

                if (optional) {

                    optionalUpload =
                        await uploadFile(
                            optional,
                            "Optional Proofs"
                        );

                }

        /* ---------- Create Submission ---------- */

        showLoader(
            "Saving your request...",
            "Updating Google Drive and Google Sheets securely."
        );

        const response =
            await server(
                "createSubmission",
                {
                    orderNumber: orderNumber,
                    username: APP.user?.username,
                    reason: reason,
                    mandatoryProof: mandatoryUpload,
                    optionalProof: optionalUpload
                }
            );

        hideLoader();

        if (response.success) {

            showToast(
                "Your request has been successfully submitted. Thanks.",
                "success"
            );

            clearSubmissionForm();

            loadRiderDashboard();

        } else {

            showToast(
                response.message,
                "error"
            );

        }

    } catch (error) {

        hideLoader();

        showToast(
            (error && error.message) ||
            "We could not submit your request. Please check your connection and try again.",
            "error"
        );

    }

}
/* ==========================================================
   ADMIN BULK UPLOAD
========================================================== */

function bulkScope() {

    return String(APP.bulkUpload?.accessScope || "")
        .trim()
        .toUpperCase()
        .replace(/\s+/g, "_");

}

function uniqueBulkValues(values) {

    const seen = new Set();

    return values.filter(value => {
        const text = String(value || "").trim();
        const key = text.toUpperCase();

        if (!text || seen.has(key)) return false;

        seen.add(key);
        return true;
    });

}

function sameBulkValue(left, right) {

    return String(left || "").trim().toUpperCase() ===
        String(right || "").trim().toUpperCase();

}

function setBulkOptions(select, values, placeholder, selectedValue) {

    if (!select) return;

    const items = uniqueBulkValues(values);

    select.innerHTML = `<option value="">${escapeHtml(placeholder)}</option>`;

    items.forEach(value => {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value;
        select.appendChild(option);
    });

    const selected = items.find(value => sameBulkValue(value, selectedValue));
    select.value = selected || "";

}

function populateBulkLocationSelectors() {

    const zoneSelect = $("#ddlBulkZone");
    const warehouseSelect = $("#ddlBulkWarehouse");
    const hubSelect = $("#ddlBulkHub");

    if (!zoneSelect || !warehouseSelect || !hubSelect) return;

    const locations = APP.bulkUpload?.locations || [];
    const current = APP.bulkUpload?.currentLocation || {};
    const scope = bulkScope();
    const previousZone = zoneSelect.value || current.zone;
    const previousWarehouse = warehouseSelect.value || current.warehouse;
    const previousHub = hubSelect.value || current.lmHub;

    setBulkOptions(
        zoneSelect,
        locations.map(location => location.zone),
        "Select Zone",
        scope === "PAN_INDIA" ? previousZone : current.zone
    );

    zoneSelect.disabled = scope !== "PAN_INDIA";

    const zoneRows = locations.filter(location =>
        sameBulkValue(location.zone, zoneSelect.value)
    );

    setBulkOptions(
        warehouseSelect,
        zoneRows.map(location => location.warehouse),
        "Select Warehouse",
        scope === "PAN_INDIA" || scope === "ZONE"
            ? previousWarehouse
            : current.warehouse
    );

    warehouseSelect.disabled =
        scope === "WAREHOUSE" || scope === "LM_HUB" || scope === "HUB";

    const warehouseRows = zoneRows.filter(location =>
        sameBulkValue(location.warehouse, warehouseSelect.value)
    );

    setBulkOptions(
        hubSelect,
        warehouseRows.map(location => location.lmHub),
        "Select LM Hub",
        scope === "LM_HUB" || scope === "HUB" ? current.lmHub : previousHub
    );

    hubSelect.disabled = scope === "LM_HUB" || scope === "HUB";

}

async function initializeBulkUpload() {

    const section = $("#bulkUploadSection");

    if (!isAdminUser() || !section) return;

    const response = await server("bulkUploadContext");

    if (!response.success) {
        showToast(response.message, "error");
        return;
    }

    APP.bulkUpload = response.data || {
        locations: [],
        accessScope: "",
        currentLocation: {}
    };

    if (!(APP.bulkUpload.locations || []).length) {
        showToast(
            "No permitted location mapping is available for bulk upload. Check Configuration!H:J and the user's access scope.",
            "warning"
        );
    }

    populateBulkLocationSelectors();

}

function downloadBulkTemplate() {

    if (!window.XLSX) {
        showToast("Spreadsheet support is still loading. Please try again in a moment.", "warning");
        return;
    }

    const worksheet = XLSX.utils.aoa_to_sheet([
        ["Order Number", "Reason", "Hub Manager Remarks"]
    ]);

    worksheet["!cols"] = [
        { wch: 18 },
        { wch: 34 },
        { wch: 36 }
    ];

    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "Bulk Upload");
    const appName = String(APP.configuration?.name || "Delivery_Exception_Portal")
        .replace(/[^A-Za-z0-9]+/g, "_")
        .replace(/^_+|_+$/g, "") || "Delivery_Exception_Portal";
    XLSX.writeFile(workbook, appName + "_Admin_Bulk_Upload_Template.xlsx");

}

function normaliseBulkHeader(value) {

    return String(value || "")
        .trim()
        .toUpperCase()
        .replace(/[^A-Z0-9]+/g, " ")
        .trim();

}

async function readBulkUploadFile(file) {

    const extension = String(file?.name || "")
        .split(".")
        .pop()
        .toLowerCase();

    if (["csv", "xlsx", "xls", "ods"].indexOf(extension) === -1) {
        throw new Error("Use a CSV, Excel (.xlsx/.xls), or OpenDocument Spreadsheet (.ods) file.");
    }

    if (!window.XLSX) {
        throw new Error("Spreadsheet support is still loading. Please try again in a moment.");
    }

    const workbook = XLSX.read(await file.arrayBuffer(), {
        type: "array",
        cellDates: false
    });

    const sheetName = workbook.SheetNames[0];

    if (!sheetName) {
        throw new Error("The selected file does not contain a worksheet.");
    }

    const values = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], {
        header: 1,
        defval: "",
        blankrows: false,
        raw: false
    });

    if (values.length < 2) {
        throw new Error("Add at least one data row below the template headers.");
    }

    const headers = values[0].map(normaliseBulkHeader);
    const orderIndex = headers.indexOf("ORDER NUMBER");
    const reasonIndex = headers.indexOf("REASON");
    const remarksIndex = headers.indexOf("HUB MANAGER REMARKS");

    if (orderIndex === -1 || reasonIndex === -1 || remarksIndex === -1) {
        throw new Error(
            "The first row must contain exactly these headers: Order Number, Reason, Hub Manager Remarks."
        );
    }

    const rows = values.slice(1).map(row => ({
        orderNumber: String(row[orderIndex] || "").trim(),
        reason: String(row[reasonIndex] || "").trim(),
        hubManagerRemarks: String(row[remarksIndex] || "").trim()
    })).filter(row =>
        row.orderNumber || row.reason || row.hubManagerRemarks
    );

    if (!rows.length) {
        throw new Error("The selected file has no uploadable data rows.");
    }

    return rows;

}

async function submitBulkUpload() {

    const file = $("#fileBulkSubmission")?.files?.[0];
    const location = {
        zone: $("#ddlBulkZone")?.value || "",
        warehouse: $("#ddlBulkWarehouse")?.value || "",
        lmHub: $("#ddlBulkHub")?.value || ""
    };

    if (!file) {
        showToast("Choose a completed bulk-upload file first.", "warning");
        return;
    }

    if (!location.zone || !location.warehouse || !location.lmHub) {
        showToast("Choose the Zone, Warehouse and LM Hub before uploading.", "warning");
        return;
    }

    try {

        const rows = await readBulkUploadFile(file);

        if (!(await confirmAction({
            title: "Confirm bulk upload",
            message: `${rows.length} submission(s) will be uploaded and approved immediately.`,
            confirmText: "Upload & approve",
            details: [
                { label: "Zone", value: location.zone },
                { label: "Warehouse", value: location.warehouse },
                { label: "LM Hub", value: location.lmHub }
            ]
        }))) {
            return;
        }

        showLoader(
            "Uploading your batch...",
            "Your entries are queued and are being approved securely."
        );

        const response = await server("bulkCreateSubmissions", rows, location);

        hideLoader();

        if (!response.success) {
            showToast(response.message, "error");
            return;
        }

        const summary = $("#bulkUploadSummary");
        summary.textContent = response.message;
        summary.classList.remove("hidden");
        $("#fileBulkSubmission").value = "";

        showToast(response.message, "success");
        loadAdminDashboard();

    } catch (error) {

        hideLoader();
        showToast(error.message || "Unable to process the selected bulk-upload file.", "error");

    }

}

function normalisePendingFilterValue(value){

    return String(value ?? "")
        .trim()
        .toLowerCase();

}

function samePendingFilterValue(left,right){

    return normalisePendingFilterValue(left) ===
        normalisePendingFilterValue(right);

}

function uniquePendingFilterValues(values){

    const found = {};

    return values
        .map(value => String(value ?? "").trim())
        .filter(value => {

            const key = normalisePendingFilterValue(value);

            if (!key || found[key]) return false;

            found[key] = true;

            return true;

        })
        .sort((left,right) => left.localeCompare(right));

}

function setPendingFilterOptions(selectId,allLabel,values){

    const select = $(selectId);

    if (!select) return;

    const previous = select.value;

    select.replaceChildren(new Option(allLabel,""));

    values.forEach(value => {

        select.add(new Option(value,value));

    });

    if (values.some(value => samePendingFilterValue(value,previous))) {

        select.value = previous;

    }

}

function populatePendingLocationFilters(){

    const locations = Array.isArray(APP.pendingLocations)
        ? APP.pendingLocations
        : [];

    const zone = $("ddlPendingZone");
    const warehouse = $("ddlPendingWarehouse");
    const hub = $("ddlPendingHub");

    if (!zone || !warehouse || !hub) return;

    setPendingFilterOptions(
        "ddlPendingZone",
        "All Zones",
        uniquePendingFilterValues(locations.map(row => row.zone))
    );

    const warehouses = locations
        .filter(row => !zone.value || samePendingFilterValue(row.zone,zone.value))
        .map(row => row.warehouse);

    setPendingFilterOptions(
        "ddlPendingWarehouse",
        "All Warehouses",
        uniquePendingFilterValues(warehouses)
    );

    const hubs = locations
        .filter(row => !zone.value || samePendingFilterValue(row.zone,zone.value))
        .filter(row => !warehouse.value || samePendingFilterValue(row.warehouse,warehouse.value))
        .map(row => row.lmHub);

    setPendingFilterOptions(
        "ddlPendingHub",
        "All LM Hubs",
        uniquePendingFilterValues(hubs)
    );

}

function applyPendingFilters(){

    const search = normalisePendingFilterValue($("txtPendingSearch")?.value);
    const zone = $("ddlPendingZone")?.value || "";
    const warehouse = $("ddlPendingWarehouse")?.value || "";
    const hub = $("ddlPendingHub")?.value || "";

    const filtered = (APP.pendingRequests || []).filter(item => {

        const searchText = [

            item.orderNumber,
            item.riderName,
            item.employeeId,
            item.zone,
            item.warehouse,
            item.lmHub
        ].map(normalisePendingFilterValue).join(" ");

        return (!search || searchText.includes(search)) &&
            (!zone || samePendingFilterValue(item.zone,zone)) &&
            (!warehouse || samePendingFilterValue(item.warehouse,warehouse)) &&
            (!hub || samePendingFilterValue(item.lmHub,hub));

    });

    renderPendingRequest(filtered);

}

/* ==========================================================
   REPOSITORY DATE RANGE
========================================================== */

function isoDate(date) {

    const copy = new Date(date.getTime());
    copy.setHours(0, 0, 0, 0);

    const year = copy.getFullYear();
    const month = String(copy.getMonth() + 1).padStart(2, "0");
    const day = String(copy.getDate()).padStart(2, "0");

    return `${year}-${month}-${day}`;

}

function shiftDate(date, days) {

    const copy = new Date(date.getTime());
    copy.setDate(copy.getDate() + days);

    return copy;

}

function startOfWeek(date) {

    const copy = new Date(date.getTime());
    const day = copy.getDay();
    const distanceToMonday = day === 0 ? -6 : 1 - day;

    return shiftDate(copy, distanceToMonday);

}

function startOfQuarter(date) {

    return new Date(date.getFullYear(), Math.floor(date.getMonth() / 3) * 3, 1);

}

function repositoryPresetRange(preset) {

    const today = new Date();
    today.setHours(0, 0, 0, 0);

    const range = (start, end) => ({
        start: isoDate(start),
        end: isoDate(end)
    });

    switch (preset) {
        case "today":
            return range(today, today);
        case "yesterday":
            return range(shiftDate(today, -1), shiftDate(today, -1));
        case "previous7":
            return range(shiftDate(today, -13), shiftDate(today, -7));
        case "last7":
            return range(shiftDate(today, -6), today);
        case "last15":
            return range(shiftDate(today, -14), today);
        case "last30":
            return range(shiftDate(today, -29), today);
        case "last90":
            return range(shiftDate(today, -89), today);
        case "thisMonth":
            return range(new Date(today.getFullYear(), today.getMonth(), 1), today);
        case "lastWeek": {
            const currentWeek = startOfWeek(today);
            return range(shiftDate(currentWeek, -7), shiftDate(currentWeek, -1));
        }
        case "lastMonth":
            return range(
                new Date(today.getFullYear(), today.getMonth() - 1, 1),
                new Date(today.getFullYear(), today.getMonth(), 0)
            );
        case "lastQuarter": {
            const currentQuarter = startOfQuarter(today);
            const previousQuarterEnd = shiftDate(currentQuarter, -1);
            return range(startOfQuarter(previousQuarterEnd), previousQuarterEnd);
        }
        case "weekToDate":
            return range(startOfWeek(today), today);
        case "monthToDate":
            return range(new Date(today.getFullYear(), today.getMonth(), 1), today);
        case "quarterToDate":
            return range(startOfQuarter(today), today);
        default:
            return { start: "", end: "" };
    }

}

function readableRepositoryDate(value) {

    if (!value) return "";

    return new Date(value + "T00:00:00").toLocaleDateString("en-US", {
        day: "numeric",
        month: "short",
        year: "numeric"
    });

}

function updateRepositoryDateRangeLabel() {

    const label = $("#repositoryDateRangeLabel");
    const range = APP.repositoryDateRange || {};

    if (!label) return;

    if (!range.start && !range.end) {
        label.textContent = "All dates";
        return;
    }

    const start = readableRepositoryDate(range.start) || "Start";
    const end = readableRepositoryDate(range.end) || "Today";

    label.textContent = `${start} – ${end}`;

}

                </div>

                        </button>

                            <button type="button" class="repository-date-preset" data-repository-date-preset="${key}">
                                ${label}
                            </button>
                        `).join("")}
                    </div>

                            <input id="repositoryDateStart" type="date" class="form-control" value="${range.start}">

                </div>
                <div class="modal-footer">
                    <button type="button" class="secondary-btn" data-repository-date-cancel>Cancel</button>
                    <button type="button" class="secondary-btn" data-repository-date-clear>Clear</button>
                    <button type="button" class="primary-btn" data-repository-date-apply>Apply</button>
                </div>
            </div>
        </div>
    `;

    const modal = container.querySelector(".repository-date-modal");
    const startInput = container.querySelector("#repositoryDateStart");
    const endInput = container.querySelector("#repositoryDateEnd");

    function close() {
        document.removeEventListener("keydown", onKeydown);
        container.innerHTML = "";
    }

    function selectPresetButton(button) {
        container.querySelectorAll(".repository-date-preset")
            .forEach(item => item.classList.remove("active"));
        button?.classList.add("active");
    }

    function onKeydown(event) {
        if (event.key === "Escape") close();
    }

    container.querySelectorAll("[data-repository-date-preset]")
        .forEach(button => button.addEventListener("click", () => {
            const next = repositoryPresetRange(button.dataset.repositoryDatePreset);
            startInput.value = next.start;
            endInput.value = next.end;
            selectPresetButton(button);
        }));

    container.querySelectorAll("[data-repository-date-clear]")
        .forEach(button => button.addEventListener("click", () => {
            startInput.value = "";
            endInput.value = "";
            selectPresetButton(container.querySelector("[data-repository-date-clear]"));
        }));

    [startInput, endInput].forEach(input => input?.addEventListener("change", () => {
        container.querySelectorAll(".repository-date-preset")
            .forEach(item => item.classList.remove("active"));
    }));

    container.querySelector("[data-repository-date-cancel]")
        ?.addEventListener("click", close);

    container.querySelector("[data-repository-date-apply]")
        ?.addEventListener("click", () => {
            const start = startInput.value;
            const end = endInput.value;

            if (start && end && start > end) {
                showToast("The end date must be the same as or later than the start date.", "warning");
                return;
            }

            APP.repositoryDateRange = { start, end };
            updateRepositoryDateRangeLabel();
            close();

            if ($("#txtRepositorySearch")?.value.trim()) {
                searchRepository();
            }
        });

    modal?.addEventListener("click", event => {
        if (event.target === modal) close();
    });

    document.addEventListener("keydown", onKeydown);

}

async function searchRepository(){

    const type=

        $("#ddlRepositorySearchType").value;

    const value=

        $("#txtRepositorySearch")

        .value

        .trim();

    const dateRange = Object.assign({}, APP.repositoryDateRange || {});

    if(!value){

        showToast(

            "Enter search value.",

            "warning"

        );

        return;

    }

    try{

        showLoader(
            "Preparing your results...",
            "Keep calm — your search results are being populated."
        );

        const response = type === "orderHistory"
            ? await server("repositoryOrderHistory", value, dateRange)
            : await server("repositorySearch", type, value, dateRange);

        hideLoader();

        if(!response.success){

            showToast(

                response.message,

                "error"

            );

            return;

        }

        if (type === "orderHistory") {
            renderRepositoryAudit(response.data);
        } else {
            renderRepository(response.data);
        }

    }

    catch(error){

        hideLoader();

        showToast(

            error.message,

            "error"

        );

    }

function downloadRepositoryFile(content, mimeType, fileName){

    const blob = new Blob([content], { type: mimeType });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download = fileName;
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);

}

function exportRepository(format){

    const rows = APP.repositoryResults || [];

    if (!rows.length) {
        showToast("Run a repository search before exporting.", "warning");
        return;
    }

    const columns = repositoryExportColumns();
    const stamp = new Date().toISOString().slice(0, 10);

    if (format === "csv") {

        const csvCell = value =>
            '"' + String(value ?? "").replace(/"/g, '""') + '"';

        const content = "\uFEFF" + [
            columns.map(column => csvCell(column[0])).join(","),
            ...rows.map(item =>
                columns.map(column => csvCell(item[column[1]])).join(",")
            )
        ].join("\r\n");

        downloadRepositoryFile(
            content,
            "text/csv;charset=utf-8",
            "repository-results-" + stamp + ".csv"
        );

    } else {

        const headerCells = columns.map(column =>
            "<th>" + escapeHtml(column[0]) + "</th>"
        ).join("");
        const bodyRows = rows.map(item =>
            "<tr>" + columns.map(column =>
                "<td>" + escapeHtml(item[column[1]] ?? "") + "</td>"
            ).join("") + "</tr>"
        ).join("");

        const content = "\uFEFF<!doctype html><html><head><meta charset=\"utf-8\">" +
            "<style>table{border-collapse:collapse}th,td{border:1px solid #b7c5d8;padding:6px;white-space:nowrap}th{background:#eef3f8}</style>" +
            "</head><body><table><thead><tr>" + headerCells +
            "</tr></thead><tbody>" + bodyRows +
            "</tbody></table></body></html>";

        downloadRepositoryFile(
            content,
            "application/vnd.ms-excel;charset=utf-8",
            "repository-results-" + stamp + ".xls"
        );

    }

}

/* ==========================================================

function confirmAction(options){

    const config = typeof options === "string"
        ? { message: options }
        : (options || {});

    const container = document.getElementById("dialogContainer");

    if (!container) {
        return Promise.resolve(window.confirm(config.message || "Are you sure?"));
    }

    const title = config.title || "Please confirm";
    const message = config.message || "Are you sure you want to continue?";
    const confirmText = config.confirmText || "Confirm";
    const cancelText = config.cancelText || "Cancel";
    const details = Array.isArray(config.details) ? config.details : [];
    const detailRows = details.map(detail => `
        <div class="confirmation-location-row">
            <span>${escapeHtml(detail.label || "")}</span>
            <strong>${escapeHtml(detail.value || "-")}</strong>
        </div>
    `).join("");

    return new Promise(resolve => {

        container.innerHTML = `
            <div class="modal active confirmation-modal"
                 role="dialog"
                 aria-modal="true"
                 aria-labelledby="confirmationDialogTitle">
                <div class="modal-content" role="document">
                    <div class="modal-header">
                        <span id="confirmationDialogTitle">${escapeHtml(title)}</span>
                    </div>
                    <div class="modal-body">
                        <p class="confirmation-message">${escapeHtml(message)}</p>
                        ${detailRows ? `<div class="confirmation-location">${detailRows}</div>` : ""}
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="secondary-btn" data-confirm-cancel>
                            ${escapeHtml(cancelText)}
                        </button>
                        <button type="button" class="primary-btn" data-confirm-approve>
                            ${escapeHtml(confirmText)}
                        </button>
                    </div>
                </div>
            </div>
        `;

        const modal = container.querySelector(".confirmation-modal");
        const confirmButton = container.querySelector("[data-confirm-approve]");
        const cancelButton = container.querySelector("[data-confirm-cancel]");

        function finish(result) {
            document.removeEventListener("keydown", handleKeydown);
            container.innerHTML = "";
            resolve(result);
        }

        function handleKeydown(event) {
            if (event.key === "Escape") finish(false);
        }

        confirmButton?.addEventListener("click", () => finish(true));
        cancelButton?.addEventListener("click", () => finish(false));
        modal?.addEventListener("click", event => {
            if (event.target === modal) finish(false);
        });
        document.addEventListener("keydown", handleKeydown);
        confirmButton?.focus();

    });

}
